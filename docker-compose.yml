# ============================================================
# Motor de WhatsApp do Melodias e Riffs — stack pro VPS (24/7)
# Sobe: Evolution API (WhatsApp não-oficial multi-número) + Postgres +
# Redis + o nosso "engine" (a cola que o app e os webhooks falam).
# ============================================================
version: "3.8"

services:
  # ---- Banco do Evolution ----
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redisdata:/data

  # ---- Evolution API: conecta os números por QR, envia, grupos, mídia ----
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on: [postgres, redis]
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      # manda os eventos (mensagem recebida, status) pro nosso engine:
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://engine:8080/webhook/evolution
    volumes:
      - evoinstances:/evolution/instances
    ports:
      # SEGURANCA: antes ficava exposto na internet (qualquer um alcançava em HTTP).
      # - "8081:8080"
      # Agora só local (host): de fora, só pelo HTTPS evolution.melodiaseriffs.com.br (Caddy).
      - "127.0.0.1:8081:8080"

  # ---- Nosso engine: projetos (baixo/violão/teclado), disparos, tags, CRM, webhooks de pagamento ----
  engine:
    build: ./engine
    restart: always
    depends_on: [evolution]
    environment:
      PORT: "8080"
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      ENGINE_API_KEY: ${ENGINE_API_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      GURU_TOKEN: ${GURU_TOKEN}
      LASTLINK_TOKEN: ${LASTLINK_TOKEN}
      CADEMI_TOKEN: ${CADEMI_TOKEN:-}
      IMPORTAR_ATIVO: ${IMPORTAR_ATIVO:-true}
      # ---- Agentes IA (Etapa 14): chave e modelo do LLM (vêm do .env) ----
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      # ---- OneDrive via rclone (Etapa 21): o motor pega mídia do OneDrive ----
      ONEDRIVE_REMOTE: "onedrive"
      ONEDRIVE_PASTA_BASE: "Postagem Automatica"
      RCLONE_CONFIG: /root/.config/rclone/rclone.conf
    volumes:
      - enginedata:/data
      # config do rclone (token do OneDrive) do HOST -> container. rw p/ renovar token.
      - /root/.config/rclone:/root/.config/rclone
    ports:
      # SEGURANCA: antes ficava exposto na internet.
      # - "8080:8080"
      # Agora só local (host): o app e os webhooks usam o HTTPS motor.melodiaseriffs.com.br (Caddy).
      - "127.0.0.1:8080:8080"

  # ---- (Opcional) proxy HTTPS com domínio + SSL automático ----
  # Só sobe quando você tiver um domínio apontado: docker compose --profile proxy up -d
  caddy:
    image: caddy:2-alpine
    restart: always
    profiles: ["proxy"]
    depends_on: [engine]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config

volumes:
  pgdata:
  redisdata:
  evoinstances:
  enginedata:
  caddydata:
  caddyconfig:
